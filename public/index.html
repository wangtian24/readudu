<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readudu</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f7f5f0; --panel: #fffdf9; --ink: #1d1b18; --muted: #6f6a60; --line: #e4dfd4;
  --accent: #b3261e; --accent-soft: #fbe9e7; --hl: #fff1b8; --hl-ink: #5c4400; --learned: #d8efd9;
  --en: #365d8c; --ok: #2e7d32;
  --fs: 1; /* user font scale */
  --tl-font: "PT Sans", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16150f; --panel: #1f1d17; --ink: #ece8df; --muted: #a39d90; --line: #36332a;
    --accent: #ff8a80; --accent-soft: #3a1f1c; --hl: #4a3d10; --hl-ink: #ffe28a; --learned: #1f3b22; --en: #8fb4e0; --ok: #81c784; }
}
* { box-sizing: border-box; }
html { font-size: calc(18px * var(--fs)); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
button { font: inherit; font-size: .9rem; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:disabled { opacity: .5; cursor: default; }
.tl { font-family: var(--tl-font); }
.app { display: grid; grid-template-columns: 250px 1fr 400px; height: 100vh; }
.app.no-detail { grid-template-columns: 250px 1fr; }
.app.no-detail .detail { display: none; }
aside, main, .detail { overflow-y: auto; }
aside { border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
aside button { font-size: 14px; }
.detail { border-left: 1px solid var(--line); padding: 20px; background: var(--panel); }
main { padding: 0 40px 80px; }
h1 { font-size: 18px; margin: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 20px; letter-spacing: -.01em; }
.brand img { border-radius: 8px; }
.lfilter { display: flex; gap: 4px; flex-wrap: wrap; }
.lfilter button { font-size: 12px; padding: 2px 8px; border-radius: 99px; }
.units .c { font-size: 11px; color: var(--muted); opacity: .75; margin-top: 1px; }
.units .fl { font-size: 13px; margin-right: 4px; }
.units { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.units li { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.units li:hover { background: var(--panel); }
.units li.active { background: var(--panel); outline: 1px solid var(--line); }
.units .t { font-weight: 600; font-family: var(--tl-font); font-size: 16px; }
.units .s { font-size: 12px; color: var(--muted); }
.units .err { color: var(--accent); }
.units li { position: relative; }
.units .x { position: absolute; top: 6px; right: 6px; border: none; background: none; padding: 0 5px; font-size: 12px; color: var(--muted); opacity: 0; }
.units li:hover .x { opacity: .7; }
.units .x:hover { opacity: 1; color: var(--accent); }

/* header + tabs */
/* Header: fixed pixel sizes, fixed heights and fixed-width controls so nothing moves. */
.head { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -40px 20px; padding: 0 40px; font-size: 14px; line-height: 20px; }
.head button { font-size: 13px; line-height: 18px; }
.head .row1 { display: flex; align-items: center; gap: 16px; height: 44px; }
.head .ttl { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.head .ttl .tl { font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
.head .ttl .en { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 2; min-width: 0; }
.level { font-size: 11px; line-height: 16px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 99px; flex-shrink: 0; }
.tabs { display: flex; flex-shrink: 0; height: 44px; }
.tabs .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 0 10px; color: var(--muted); height: 44px; }
.tabs .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tools { display: flex; align-items: center; gap: 6px; height: 40px; }
.tools button { height: 28px; padding: 0 8px; border-radius: 6px; white-space: nowrap; text-align: center; }
.tools .t-en { width: 72px; } .tools .t-stress { width: 80px; } .tools .t-hl { width: 84px; }
.tools .t-gloss { width: 118px; } .tools .t-col { width: 64px; } .tools .t-slow { width: 56px; }
.tools .t-play { width: 76px; } .tools .t-fs { width: 34px; padding: 0; }
.tools .fs-val { width: 40px; text-align: center; color: var(--muted); font-size: 12px; }
.tools .sep { flex: 1; }
@media (max-width: 1150px) { .head { margin: 0 -16px 16px; padding: 0 16px; } .head .row1 { height: auto; flex-wrap: wrap; } .tools { height: auto; flex-wrap: wrap; padding: 6px 0; } }

/* tokens */
.w { cursor: pointer; border-radius: 3px; }
.w:hover { background: var(--line); }
.w.sel { outline: 2px solid var(--accent); }
.kp { background: var(--hl); color: var(--hl-ink); }
.kp.learned { background: var(--learned); color: inherit; }
.hl-off .kp { background: none; color: inherit; }

/* read tab */
.reading { max-width: 820px; display: flex; flex-direction: column; gap: 30px; }
.para { display: grid; grid-template-columns: 90px 1fr; gap: 12px; align-items: start; }
.para.prose { grid-template-columns: 1fr; }
.chunks { display: flex; flex-direction: column; gap: 10px; }
.chunk { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; padding: 4px 8px; margin: -4px -8px; border-radius: 8px; }
.chunk:hover { background: var(--panel); }
.para .who { font-weight: 700; color: var(--accent); text-align: right; padding-top: .35rem; }
.para .tl { font-size: 1.6rem; line-height: 1.6; }
.para.heading .tl { font-size: 1.9rem; font-weight: 700; }
.para.note .tl { font-style: italic; color: var(--muted); font-size: 1.3rem; }
.para .en { color: var(--en); font-size: 1rem; margin-top: 4px; }
.para .acts { display: flex; gap: 2px; padding-top: .3rem; opacity: .6; }
.chunk:hover .acts { opacity: 1; }
.icon { border: none; background: none; padding: 2px 4px; opacity: .45; font-size: 1rem; }
.icon:hover { opacity: 1; }
.sent { border-radius: 4px; }
.sent.done { text-decoration: underline dotted var(--ok) 2px; text-underline-offset: 6px; }

/* guided tab */
.guided { max-width: 860px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; }
.dots span { width: 14px; height: 14px; border-radius: 4px; background: var(--line); cursor: pointer; }
.dots span.done { background: var(--ok); opacity: .6; }
.dots span.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.ctx { color: var(--muted); font-size: 1.15rem; opacity: .6; min-height: 1.6em; }
.focus { margin: 14px 0 18px; }
.focus .who { color: var(--accent); font-weight: 700; font-size: .95rem; }
.focus .tl { font-size: 2.3rem; line-height: 1.45; }
.nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.nav .count { color: var(--muted); font-size: .85rem; margin-left: auto; }
.sec { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; background: var(--panel); }
.sec > .sh { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sec > .sh .k { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .75rem; }
.sec > .sb { padding: 0 16px 14px; }
.sec.closed > .sb { display: none; }
.sec .big-en { font-size: 1.3rem; color: var(--en); }
.sec .lit { color: var(--muted); margin-top: 6px; }
table.words { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.words td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
table.words td:first-child { font-family: var(--tl-font); font-size: 1.15rem; font-weight: 600; white-space: nowrap; }
table.words .lemma { font-family: var(--tl-font); }
table.words .form { color: var(--muted); font-size: .85rem; }
table.words tr { cursor: pointer; }
table.words tr:hover td { background: var(--bg); }
.anec { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; }

/* cards & tables */
.card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; background: var(--bg); }
.detail .card { background: var(--bg); }
main .card { background: var(--panel); }
.card .ph { font-size: 1.5rem; font-weight: 700; font-family: var(--tl-font); }
.card .sub { color: var(--muted); font-size: .9rem; }
.card .gl { color: var(--en); margin: 4px 0 8px; font-size: 1.05rem; }
.card .cat { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.card ul { padding-left: 20px; margin: 8px 0 0; }
.card li .tl { font-size: 1.05rem; }
.ex-en { color: var(--muted); }
.grid { border-collapse: collapse; margin-top: 8px; font-size: .95rem; }
.grid th, .grid td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.grid th { background: var(--bg); font-weight: 600; font-size: .8rem; color: var(--muted); }
.grid td { font-family: var(--tl-font); font-size: 1.05rem; }
.cols { columns: 2 380px; column-gap: 14px; }
.cols .card { break-inside: avoid; }
h2.sect { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 12px; }
.detail h2.sect { margin-top: 20px; }
.plist { list-style: none; padding: 0; margin: 0; }
.plist li { display: flex; gap: 10px; align-items: baseline; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.plist li:hover { background: var(--bg); }
.plist li b { font-family: var(--tl-font); font-size: 1.1rem; }
.plist li span { color: var(--muted); flex: 1; font-size: .9rem; }
.plist li.learned b { text-decoration: line-through; opacity: .6; }
.plist li .n { flex: 0; color: var(--muted); font-size: .75rem; }
.filters { display: flex; gap: 6px; margin-bottom: 12px; }

/* composer */
.composer { max-width: 900px; padding-top: 24px; }
.composer h2 { margin: 0 0 4px; }
.composer p.hint { color: var(--muted); margin: 0 0 20px; }
.tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
.tray .pg { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.tray .pg img { width: 100%; height: 190px; object-fit: cover; display: block; }
.tray .pg .bar { display: flex; align-items: center; gap: 2px; padding: 4px; font-size: .8rem; }
.tray .pg .bar b { margin-right: auto; padding-left: 4px; }
.tray .pg .bar button { padding: 0 6px; font-size: .8rem; }
.tray .add-tile { border: 2px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 220px; color: var(--muted); }
select.sel { font: inherit; padding: 8px; border-radius: 8px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); min-width: 280px; }
textarea, input[type=text] { width: 100%; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
textarea { min-height: 200px; font-family: var(--tl-font); font-size: 1.2rem; resize: vertical; }
label.lb { display: block; font-weight: 600; margin: 20px 0 6px; }
.empty { color: var(--muted); max-width: 560px; margin: 80px auto; text-align: center; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; font-size: .8rem; }
.steps span { padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.steps span.done { background: var(--learned); color: var(--ink); border-color: transparent; }
.steps span.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pbar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px auto; max-width: 420px; }
.pbar div { height: 100%; background: var(--accent); transition: width .6s; }
#playerBar { position: fixed; bottom: 20px; right: 20px; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,.25); border-radius: 99px; padding: 10px 18px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; z-index: 10; font-size: .9rem; }
.page-img { max-width: 100%; border-radius: 8px; margin: 8px 0; border: 1px solid var(--line); }
pre.src { white-space: pre-wrap; font-family: var(--tl-font); font-size: 1.2rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

dialog { border: none; border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink); width: min(1000px, 96vw); }
dialog::backdrop { background: rgba(0,0,0,.65); }
.cam { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cam video { width: 100%; max-height: 62vh; object-fit: contain; background: #000; border-radius: 8px; }
.cam .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cam select { font: inherit; font-size: .85rem; padding: 6px; border-radius: 8px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); max-width: 340px; }
.cam .strip { display: flex; gap: 6px; overflow-x: auto; min-height: 70px; }
.cam .strip img { height: 70px; border-radius: 4px; border: 1px solid var(--line); }
.flash { animation: flash .25s; }
@keyframes flash { from { filter: brightness(3); } }
.cam video.mirror { transform: scaleX(-1); }
/* interlinear gloss + part-of-speech colours */
.gloss .tl { line-height: 1.25; }
.gloss .para .tl, .gloss .focus .tl { display: block; }
.w.g { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; margin: 0 1px 10px; padding: 0 2px; }
.w.g .gw { line-height: 1.3; }
.w.g .ge { font-family: -apple-system, system-ui, sans-serif; font-size: .55em; color: var(--en); max-width: 9em; text-align: center; line-height: 1.2; }
ruby rt { font-size: .5em; color: var(--muted); font-weight: 400; }
.w.g .gt { font-family: -apple-system, system-ui, sans-serif; font-size: .5em; color: var(--muted); font-style: italic; line-height: 1.2; }
.w.g .gf { font-family: -apple-system, system-ui, sans-serif; font-size: .42em; color: var(--muted); max-width: 11em; text-align: center; line-height: 1.2; margin-top: 2px; }
.w.g .gf b { font-family: var(--tl-font); font-weight: 600; font-size: 1.2em; color: var(--ink); }
.gloss .gap { vertical-align: top; line-height: 1.3; }
.colors .pos-noun .gw, .colors .pos-noun:not(.g) { color: var(--c-noun); }
.colors .pos-verb .gw, .colors .pos-verb:not(.g) { color: var(--c-verb); }
.colors .pos-adj .gw, .colors .pos-adj:not(.g) { color: var(--c-adj); }
.colors .pos-pron .gw, .colors .pos-pron:not(.g) { color: var(--c-pron); }
.colors .pos-adv .gw, .colors .pos-adv:not(.g) { color: var(--c-adv); }
.colors .pos-num .gw, .colors .pos-num:not(.g) { color: var(--c-num); }
.colors .pos-func .gw, .colors .pos-func:not(.g) { color: var(--c-func); }
.colors .pos-name .gw, .colors .pos-name:not(.g) { color: var(--c-name); }
:root { --c-noun: #1f5fbf; --c-verb: #c62828; --c-adj: #2e7d32; --c-pron: #7b3fa0; --c-adv: #c25e00; --c-num: #00838f; --c-func: #7a7468; --c-name: #ad1457; }
@media (prefers-color-scheme: dark) { :root { --c-noun: #82b1ff; --c-verb: #ff8a80; --c-adj: #a5d6a7; --c-pron: #ce93d8; --c-adv: #ffb74d; --c-num: #80deea; --c-func: #a39d90; --c-name: #f48fb1; } }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin: -8px 0 12px; }
.legend span::before { content: "■ "; }
.drop { outline: 4px dashed var(--accent); outline-offset: -14px; }

@media (max-width: 1150px) {
  .app, .app.no-detail { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .detail { border-left: 0; border-top: 1px solid var(--line); }
  main { padding: 0 16px 40px; }
  .para, .para.prose { grid-template-columns: 1fr auto; }
  .para .who { text-align: left; grid-column: 1 / -1; padding: 0; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <h1 class="brand"><img src="/logo.svg" alt="" width="30" height="30">Readudu</h1>
    <button class="primary" id="newBtn">＋ New reading</button>
    <div class="lfilter" id="lfilter"></div>
    <ul class="units" id="units"></ul>
    <div style="margin-top:auto;color:var(--muted);font-size:.75rem">Drop or paste images / text anywhere.</div>
  </aside>
  <main id="main"></main>
  <section class="detail" id="detail"></section>
</div>

<dialog id="camDlg">
  <div class="cam">
    <div class="row">
      <select id="camSel"></select>
      <label style="font-size:.85rem"><input type="checkbox" id="mirrorChk" checked> Mirror preview</label>
      <span style="flex:1"></span>
      <span id="camCount" style="color:var(--muted)"></span>
    </div>
    <video id="video" class="mirror" autoplay playsinline muted></video>
    <div class="strip" id="camStrip"></div>
    <div class="row">
      <button class="primary" id="snap">📸 Capture page <small>(Space)</small></button>
      <button id="undoShot">Remove last</button>
      <span style="flex:1"></span>
      <button class="primary" id="camDone">Done</button>
    </div>
  </div>
</dialog>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ACUTE = '́';
const norm = s => String(s || '').replaceAll(ACUTE, '').toLowerCase().replaceAll('ё', 'е');

let state = { showEn: false, showReading: true, lang: '', langFilter: 'all', highlight: true, fontScale: 1, slowAudio: false, gloss: 'off', posColor: false, model: '', current: null, tab: 'read', progress: {} };
let units = [], unit = null, view = 'unit'; // view: 'unit' | 'compose'
let sel = null;              // {type:'word', s, w} | {type:'phrase', p}
let revealedParas = new Set();
let gIdx = 0, gOpen = new Set(); // guided: current sentence, opened sections
let vocabFilter = 'all';
let draft = { images: [], text: '', hint: '' }; // composer draft (images = dataURLs)
let pollTimer = null;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let saveT;
function saveState() { clearTimeout(saveT); saveT = setTimeout(() => fetch('/api/state', { method: 'PUT', body: JSON.stringify(state) }), 200); }
function prog(id = unit?.id) { return (state.progress[id] ||= { learned: [], done: [] }); }
function has(list, i) { return (list || []).includes(i); }
function toggleIn(key, i) {
  const p = prog(); p[key] ||= [];
  p[key] = has(p[key], i) ? p[key].filter(x => x !== i) : [...p[key], i];
  saveState();
}
function applyFont() { document.documentElement.style.setProperty('--fs', state.fontScale); }

/* ================= unit list ================= */
async function loadUnits() {
  units = await api('/api/units');
  const langs = [...new Set(units.map(u => u.language).filter(Boolean).map(langCode))];
  if (state.langFilter !== 'all' && !langs.includes(state.langFilter)) state.langFilter = 'all';
  $('#lfilter').innerHTML = langs.length > 1 ? [['all', 'All'], ...langs.map(c => [c, `${LANGS[c].flag} ${LANGS[c].name}`])]
    .map(([k, v]) => `<button data-lf="${k}" class="${state.langFilter === k ? 'on' : ''}">${v}</button>`).join('') : '';
  $('#units').innerHTML = units.filter(u => state.langFilter === 'all' || langCode(u.language) === state.langFilter).map(u => `
    <li data-id="${u.id}" class="${view === 'unit' && u.id === state.current ? 'active' : ''}">
      <button class="x" data-del="${u.id}" title="Delete">✕</button>
      <div class="t">${u.language ? `<span class="fl" title="${esc(langName(u.language))}">${langFlag(u.language)}</span>` : ''}${esc(u.title || (u.status === 'error' ? 'Failed' : 'Reading…'))}</div>
      <div class="s ${u.status === 'error' ? 'err' : ''}">${
        u.status === 'ready' ? esc([u.title_en, u.level, `${u.sentences} sent.`].filter(Boolean).join(' · '))
        : u.status === 'error' ? 'Failed — open to retry'
        : u.status === 'queued' ? '⏳ queued' : '⏳ ' + progressText(u.progress)}</div>

    </li>`).join('');

async function openUnit(id, keep) {

  if (state.current !== id) gIdx = prog(id).pos || 0;

/* ================= mechanical prep: tokens, phrase ranges, tables ================= */
function prepare(u) {
  u.lang = LANGS[langCode(u.language)] || LANGS.other;
  u.tableByLemma = {};
  (u.tables || []).forEach((t, i) => { u.tableByLemma[norm(t.lemma)] = i; });
  u.sentences.forEach(s => {
    // tokens: alternating gaps and words; each gloss is found in order in the sentence text
    const toks = []; let cur = 0;
    const lower = s.text.toLowerCase();
    s.words.forEach((w, wi) => {
      if (!w.text) return;
      let at = s.text.indexOf(w.text, cur);
      if (at < 0) at = lower.indexOf(w.text.toLowerCase(), cur);
      if (at < 0) return; // gloss text not found verbatim — leave that stretch unlinked
      if (at > cur) toks.push({ gap: true, t: s.text.slice(cur, at), a: cur, b: at });
      toks.push({ t: s.text.slice(at, at + w.text.length), a: at, b: at + w.text.length, wi });
      cur = at + w.text.length;
    });
    if (cur < s.text.length) toks.push({ gap: true, t: s.text.slice(cur), a: cur, b: s.text.length });
    s.toks = toks;
    s.ranges = [];
  });
  u.phrases.forEach((p, pi) => (p.occurrences || []).forEach(o => {
    const s = u.sentences[o.s]; if (!s || !o.text) return;
    let at = s.text.indexOf(o.text);
    if (at < 0) at = s.text.toLowerCase().indexOf(o.text.toLowerCase());
    if (at >= 0) s.ranges.push({ a: at, b: at + o.text.length, pi });
  }));
  u.sentences.forEach(s => s.ranges.sort((x, y) => (y.b - y.a) - (x.b - x.a))); // longest first
  u.paras = [];
  u.sentences.forEach((s, si) => {
    let p = u.paras[u.paras.length - 1];
    if (!p || p.para !== s.para) u.paras.push(p = { para: s.para, speaker: s.speaker, kind: s.kind, idx: [] });
    p.idx.push(si);
  });
  const SHORT = 4, MAX = 12; // in words
  u.paras.forEach(p => {
    p.chunks = [];
    for (const si of p.idx) {
      const n = u.sentences[si].words.length || 1;
      const last = p.chunks[p.chunks.length - 1];
      const lastN = last ? last.reduce((a, i) => a + (u.sentences[i].words.length || 1), 0) : 0;
      if (last && (lastN <= SHORT || n <= SHORT) && lastN + n <= MAX) last.push(si);
      else p.chunks.push([si]);
    }
  });
}

const LANGS = {

const langName = tag => {

function posClass(w) {

const LEGEND = [['noun', 'noun'], ['verb', 'verb'], ['adj', 'adjective'], ['pron', 'pronoun'], ['adv', 'adverb'], ['num', 'number'], ['name', 'name'], ['func', 'particle / preposition / conj.']];

// Returns escaped HTML for a word with its reading applied (stress marks inline, or furigana as ruby).
function readingHTML(tok, w) {
  const r = w?.reading;
  const mode = unit?.lang?.reading;
  if (!r || !mode || !state.showReading) return esc(tok);
  if (mode === 'inline') {
    if (!r.includes(ACUTE) || r.replaceAll(ACUTE, '').toLowerCase() !== tok.toLowerCase()) return esc(tok);
    let out = '', k = 0;
    for (const ch of r) out += ch === ACUTE ? ACUTE : tok[k++];

  if (!KANJI.test(tok) || r === tok) return esc(tok);
  // Put furigana only over the kanji part: strip kana shared at the start/end (okurigana).
  let a = 0, b = 0;
  while (a < tok.length && a < r.length && tok[a] === r[a] && !KANJI.test(tok[a])) a++;
  while (b < tok.length - a && b < r.length - a && tok[tok.length - 1 - b] === r[r.length - 1 - b] && !KANJI.test(tok[tok.length - 1 - b])) b++;

  return `${esc(tok.slice(0, a))}<ruby>${esc(mid)}<rt>${esc(rmid)}</rt></ruby>${esc(tok.slice(tok.length - b))}`;

function sentenceHTML(si) {

    const g = state.gloss !== 'off';
    if (t.gap) return r || g ? `<span class="gap${kp}"${r ? ` data-p="${r.pi}"` : ''}>${esc(t.t)}</span>` : esc(t.t);
    const w = s.words[t.wi];
    const text = readingHTML(t.t, w);
    const isSel = sel?.type === 'word' && sel.s === si && sel.w === t.wi && t.wi >= 0;
    const inner = g && w
      ? `<span class="gw">${text}</span>${unit.lang.translit && w.translit && state.gloss === 'full' ? `<span class="gt">${esc(w.translit)}</span>` : ''}<span class="ge">${esc(w.en)}</span>${state.gloss === 'full'
          ? `<span class="gf">${norm(w.lemma) !== norm(w.text) ? `<b>${esc(w.lemma)}</b> · ` : ''}${esc(w.form || w.pos)}</span>` : ''}`

    return `<span class="w${g && w ? ' g' : ''} ${w ? posClass(w) : ''}${kp}${isSel ? ' sel' : ''}" data-s="${si}" data-w="${t.wi}"${r ? ` data-p="${r.pi}"` : ''}>${inner}</span>`;

    <h2 class="sect">Sentence notes</h2>
    ${notes.map(x => `<div class="card"><div class="tl" style="font-size:1.2rem;cursor:pointer" data-guide="${x.i}">${esc(x.s.text)} ›</div><div class="anec" style="margin-top:8px">${esc(x.s.note)}</div></div>`).join('')}
  </div>`;
}
function sourceTab() {
  return `<div style="max-width:900px">
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button id="regen">↻ Regenerate with ${state.model === 'opus' ? 'Opus' : 'Sonnet'}</button>
      <button id="del">Delete reading</button>
    </div>
    <p class="sub" style="color:var(--muted)">Saved locally — opening it never calls Claude again.${unit.generation ? ` Generated by ${esc(unit.generation.model)} in ${Math.floor(unit.generation.seconds / 60)}m ${unit.generation.seconds % 60}s.` : ''}</p>
    ${unit.hint ? `<p><b>Note to Claude:</b> ${esc(unit.hint)}</p>` : ''}
    ${unit.images.map(i => `<img class="page-img" src="/files/${unit.id}/${i}">`).join('')}
    ${unit.text ? `<pre class="src">${esc(unit.text)}</pre>` : ''}
  </div>`;
}
function renderPending() {
  const since = unit.startedAt && unit.status === 'processing' ? Math.round((Date.now() - new Date(unit.startedAt)) / 1000) : 0;
  const imgs = unit.images.map(i => `<img class="page-img" style="max-height:40vh" src="/files/${unit.id}/${i}">`).join('');
  $('#main').innerHTML = unit.status === 'error'
    ? `<div class="empty" style="max-width:760px"><p>Generation failed:</p>
        <pre style="white-space:pre-wrap;text-align:left;font-size:.75rem">${esc(unit.error)}</pre>
        <p><button class="primary" id="regen">Retry</button> <button id="del">Delete</button></p>${imgs}</div>`
    : (() => {
        const pr = units.find(u => u.id === unit.id)?.progress || unit.progress;
        const est = estimateSentences(unit);
        const pct = pr && est ? Math.min(95, Math.round(100 * pr.sentences / est * .7 + (['key phrases', 'conjugation tables', 'grammar notes', 'culture notes'].indexOf(pr.phase) + 1) * 7)) : null;
        const steps = ['starting', 'thinking', 'reading pages', 'sentences', 'key phrases', 'conjugation tables', 'grammar notes', 'culture notes'];
        const cur = pr ? steps.indexOf(pr.phase === 'writing' ? 'sentences' : pr.phase) : -1;
        return `<div class="empty" style="max-width:760px"><div class="spinner"></div>
        <p style="font-size:1.2rem;color:var(--ink)">${unit.status === 'queued' ? 'Waiting for a free slot…' : `Claude is building your reading unit · ${Math.floor(since / 60)}:${String(since % 60).padStart(2, '0')}`}</p>
        <p><button id="stopGen">■ Stop generating</button> <button id="del">Delete</button></p>
        ${unit.status === 'processing' ? `<div class="steps">${steps.filter(x => x !== 'reading pages' || unit.images.length).map(x => {
            const i = steps.indexOf(x);
            return `<span class="${i < cur ? 'done' : i === cur ? 'cur' : ''}">${x === 'sentences' && pr?.sentences ? `sentences (${pr.sentences}${est ? '/' + est : ''})` : x}</span>`;
          }).join('')}</div>
          ${pct != null ? `<div class="pbar"><div style="width:${pct}%"></div></div>` : ''}
          <p><small>${pr ? `${(pr.chars / 1000).toFixed(1)}k characters written so far — it's alive.` : 'Starting claude…'} A one-page dialog takes 1–4 min depending on the model.</small></p>` : ''}
        ${imgs}
        ${unit.text ? `<pre class="src" style="text-align:left">${esc(unit.text)}</pre>` : ''}</div>`;
      })();
}

function progressText(pr) {
  if (!pr) return 'starting…';
  if (pr.phase === 'writing' || pr.phase === 'sentences') return `writing · ${pr.sentences} sentence${pr.sentences === 1 ? '' : 's'}`;
  if (['key phrases', 'conjugation tables', 'grammar notes', 'culture notes'].includes(pr.phase)) return `${pr.sentences} sentences · ${pr.phase}`;
  return pr.phase + '…';
}
function estimateSentences(u) {
  return u.text ? (u.text.match(/[.!?…]+(?=\s|$)|[。！？]+/g) || []).length || null : null;
}

/* ================= composer ================= */
function compose() { view = 'compose'; document.querySelectorAll('#units li').forEach(li => li.classList.remove('active')); render(); }
$('#newBtn').onclick = compose;
function renderComposer() {
  $('#main').innerHTML = `<div class="composer">
    <h2>New reading</h2>
    <p class="hint">Add photos of one or more pages (in order) and/or paste text — Russian, Japanese, Spanish, Portuguese or any other language. Everything becomes one reading unit.</p>
    <label class="lb">Pages ${draft.images.length ? `(${draft.images.length})` : ''}</label>
    <div class="tray">
      ${draft.images.map((src, i) => `<div class="pg"><img src="${src}">
        <div class="bar"><b>${i + 1}</b>
          <button data-mv="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''}>←</button>
          <button data-mv="${i}" data-d="1" ${i === draft.images.length - 1 ? 'disabled' : ''}>→</button>
          <button data-rm="${i}">✕</button></div></div>`).join('')}
      <div class="add-tile">
        <button class="primary" id="camBtn">📷 Camera</button>
        <button id="fileBtn">Choose photos</button>
        <small>or drop / paste</small>
      </div>
    </div>
    <label class="lb" for="txt">Text</label>
    <textarea id="txt" placeholder="Paste any text here… · Вставьте текст · ここに貼り付け · Pega el texto · Cole o texto">${esc(draft.text)}</textarea>
    <label class="lb" for="hint">Note for Claude <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input type="text" id="hint" placeholder="e.g. only the dialog on page 2 · focus on verbs of motion · I'm around A2 / N4" value="${esc(draft.hint)}">
    <label class="lb" for="lang">Language</label>
    <select id="lang" class="sel">
      ${[['', 'Auto-detect'], ['ru', '🇷🇺 Russian'], ['ja', '🇯🇵 Japanese'], ['es', '🇪🇸 Spanish'], ['pt-BR', '🇧🇷 Portuguese (Brazil)'], ['pt-PT', '🇵🇹 Portuguese (Portugal)']]
        .map(([v, n]) => `<option value="${v}" ${state.lang === v ? 'selected' : ''}>${n}</option>`).join('')}
    </select>
    <label class="lb" for="model">Model</label>
    <select id="model" class="sel">
      <option value="opus" ${state.model === 'opus' ? 'selected' : ''}>Opus — best quality (recommended)</option>
      <option value="sonnet" ${state.model === 'sonnet' ? 'selected' : ''}>Sonnet</option>
    </select>
    <p style="margin-top:20px"><button class="primary" id="gen" ${draft.images.length || draft.text.trim() ? '' : 'disabled'}>✨ Generate reading unit</button></p>
  </div>`;
  $('#txt').oninput = e => { draft.text = e.target.value; $('#gen').disabled = !(draft.images.length || draft.text.trim()); };
  $('#hint').oninput = e => { draft.hint = e.target.value; };
  $('#model').onchange = e => { state.model = e.target.value; saveState(); };
  $('#lang').onchange = e => { state.lang = e.target.value; saveState(); };
}
async function addImages(files) {
  for (const f of files) draft.images.push(await toJpegURL(f));
  if (view !== 'compose') view = 'compose';
  render();
}
// Re-encode to JPEG (handles HEIC in Safari, huge photos) capped at 2600px.
async function toJpegURL(blobOrCanvas) {
  let src = blobOrCanvas;
  if (!(src instanceof HTMLCanvasElement) && !(src instanceof HTMLVideoElement)) src = await createImageBitmap(blobOrCanvas);
  const w = src.videoWidth || src.width, h = src.videoHeight || src.height;
  const scale = Math.min(1, 2600 / Math.max(w, h));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(w * scale), height: Math.round(h * scale) });
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9);
}
async function generate() {
  $('#gen').disabled = true; $('#gen').textContent = 'Sending…';
  try {
    const { id, cached } = await api('/api/units', { method: 'POST', body: JSON.stringify({ ...draft, model: state.model, language: state.lang }) });
    if (cached) toast('Already generated — opened the saved unit (use Source → Regenerate for a fresh one).');
    draft = { images: [], text: '', hint: '' };
    state.tab = 'read';
    await loadUnits(); openUnit(id);
  } catch (e) { alert(e.message); render(); }
}

function toast(msg) {
  const d = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
  document.body.append(d); setTimeout(() => d.remove(), 4500);
}

/* ================= camera (multi-shot) ================= */
let stream = null;
const ls = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };
async function startCam(deviceId) {
  stopCam();
  stream = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: { ideal: 3840 }, height: { ideal: 2160 } },
  });
  $('#video').srcObject = stream;
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const active = stream.getVideoTracks()[0].getSettings().deviceId;
  $('#camSel').innerHTML = cams.map((c, i) => `<option value="${c.deviceId}" ${c.deviceId === active ? 'selected' : ''}>${esc(c.label || 'Camera ' + (i + 1))}</option>`).join('');
}
function stopCam() { stream?.getTracks().forEach(t => t.stop()); stream = null; }
function camStrip() {
  $('#camStrip').innerHTML = draft.images.map(s => `<img src="${s}">`).join('');
  $('#camCount').textContent = `${draft.images.length} page${draft.images.length === 1 ? '' : 's'}`;
  $('#camStrip').scrollLeft = 1e6;
}
async function openCam() {
  $('#camDlg').showModal(); camStrip();
  try { await startCam(ls('cam')); }
  catch { try { await startCam(); } catch (e) { alert('Could not open camera: ' + e.message); $('#camDlg').close(); } }
}
$('#mirrorChk').checked = ls('mirror') !== '0';
$('#video').classList.toggle('mirror', $('#mirrorChk').checked);
$('#mirrorChk').onchange = e => { ls('mirror', e.target.checked ? '1' : '0'); $('#video').classList.toggle('mirror', e.target.checked); };
$('#camSel').onchange = e => { ls('cam', e.target.value); startCam(e.target.value); };
$('#snap').onclick = async () => {
  const v = $('#video'); if (!v.videoWidth) return;
  draft.images.push(await toJpegURL(v));
  v.classList.remove('flash'); void v.offsetWidth; v.classList.add('flash');
  camStrip();
};
$('#undoShot').onclick = () => { draft.images.pop(); camStrip(); };
$('#camDone').onclick = () => $('#camDlg').close();
$('#camDlg').addEventListener('close', () => { stopCam(); view = 'compose'; render(); });

/* ================= speech (server-side macOS voice) ================= */
const audio = new Audio();
let playQueue = [], playing = false;
function setPlaying(on) {
  playing = on;
  const pb = $('#playAll'); if (pb) pb.textContent = on ? '■ Stop' : '▶ Play';
  let bar = $('#playerBar');
  if (on && !bar) {
    bar = Object.assign(document.createElement('button'), { id: 'playerBar', className: 'primary', innerHTML: '■ Stop audio <small>(Esc)</small>' });
    bar.onclick = stopAudio;
    document.body.append(bar);
  } else if (!on && bar) bar.remove();
}
function stopAudio() { playQueue = []; audio.onended = null; audio.pause(); setPlaying(false); }
audio.addEventListener('pause', () => { if (!playQueue.length && audio.ended !== false) setPlaying(false); });
audio.addEventListener('error', () => { if (!playQueue.length) setPlaying(false); });
// Dialog speakers alternate between a female and a male voice.
function voiceFor(speaker) {
  if (!speaker || !unit) return 'female';
  const names = [...new Set(unit.sentences.map(s => s.speaker).filter(Boolean))];
  return names.indexOf(speaker) % 2 ? 'male' : 'female';
}
function speak(text, onend, voice) {
  audio.onended = onend || (() => setPlaying(false));
  audio.src = `/api/tts?text=${encodeURIComponent(text)}&voice=${voice || 'female'}&lang=${encodeURIComponent(unit?.language || 'ru')}`;
  audio.preservesPitch = true;
  audio.playbackRate = state.slowAudio ? 0.75 : 1;
  setPlaying(true);
  audio.play().catch(() => setPlaying(false));
}
// Always play per sentence so every clip is cached once and reused everywhere.
function sentenceClips(idx) { return idx.map(i => ({ text: unit.sentences[i].text, voice: voiceFor(unit.sentences[i].speaker) })); }
function speakAll(items) {
  playQueue = [...items];
  const next = () => { const t = playQueue.shift(); if (t) speak(t.text, next, t.voice); else setPlaying(false); };
  next();
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  const t = e.target, c = sel => t.closest(sel);
  let el;
  if ((el = c('[data-del]'))) { e.stopPropagation(); return deleteUnit(el.dataset.del); }
  if ((el = c('[data-lf]'))) { state.langFilter = el.dataset.lf; saveState(); return loadUnits(); }
  if ((el = c('[data-tab]'))) { state.tab = el.dataset.tab; saveState(); return render(); }
  if ((el = c('[data-tog]'))) { state[el.dataset.tog] = !state[el.dataset.tog]; if (el.dataset.tog === 'showEn') revealedParas.clear(); saveState(); return render(); }
  if (t.id === 'glossBtn') { state.gloss = ({ off: 'meaning', meaning: 'full', full: 'off' })[state.gloss]; saveState(); return render(); }
  if (t.id === 'fsUp' || t.id === 'fsDown') { state.fontScale = Math.max(.7, Math.min(1.8, +(state.fontScale + (t.id === 'fsUp' ? .1 : -.1)).toFixed(2))); saveState(); applyFont(); const fv = $('.fs-val'); if (fv) fv.textContent = Math.round(state.fontScale * 100) + '%'; return; }
  if ((el = c('[data-sayt]'))) return speak(el.dataset.sayt);
  if ((el = c('[data-say-chunk]'))) { const [pi, ci] = el.dataset.sayChunk.split(':'); return speakAll(sentenceClips(unit.paras[pi].chunks[ci])); }
  if ((el = c('[data-en-chunk]'))) { const k = el.dataset.enChunk; revealedParas.has(k) ? revealedParas.delete(k) : revealedParas.add(k); return render(); }
  if ((el = c('[data-guide]'))) { gIdx = +el.dataset.guide; gOpen.clear(); state.tab = 'guided'; saveState(); return render(); }
  if ((el = c('[data-learn]'))) { toggleIn('learned', +el.dataset.learn); return render(); }
  if ((el = c('[data-vf]'))) { vocabFilter = el.dataset.vf; return render(); }
  if ((el = c('[data-go]'))) return goSentence(+el.dataset.go);
  if ((el = c('.sec > .sh'))) { const k = el.parentElement.dataset.sec; gOpen.has(k) ? gOpen.delete(k) : gOpen.add(k); return render(); }
  if ((el = c('.w[data-w], tr[data-w]')) && +el.dataset.w >= 0) {
    sel = { type: 'word', s: +el.dataset.s, w: +el.dataset.w };
    render(); $('#detail').scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  if ((el = c('[data-p]'))) { sel = { type: 'phrase', p: +el.dataset.p }; render(); $('#detail').scrollTo({ top: 0, behavior: 'smooth' }); return; }
  switch (t.id) {
    case 'playAll': if (playing) return stopAudio(); return speakAll(sentenceClips(unit.paras.filter(p => p.kind !== 'note').flatMap(p => p.idx)));
    case 'gPrev': return goSentence(gIdx - 1);
    case 'gNext': return goSentence(gIdx + 1);
    case 'gSay': return speak(unit.sentences[gIdx].text, null, voiceFor(unit.sentences[gIdx].speaker));
    case 'gReveal': return revealNext();
    case 'gAll': { const secs = guidedSections(unit.sentences[gIdx]); const all = secs.every(x => gOpen.has(x.k)); gOpen = new Set(all ? [] : secs.map(x => x.k)); return render(); }
    case 'gDone': toggleIn('done', gIdx); return render();
    case 'camBtn': return openCam();
    case 'fileBtn': return $('#fileIn').click();
    case 'gen': return generate();
    case 'regen':
      if (unit.status === 'ready' && !confirm('Regenerate this unit with Claude? The current version will be replaced.')) return;
      await api(`/api/units/${unit.id}/regenerate`, { method: 'POST', body: JSON.stringify({ model: state.model }) }); await loadUnits(); return openUnit(unit.id);
    case 'del': return deleteUnit(unit.id);
    case 'stopGen': await api(`/api/units/${unit.id}/stop`, { method: 'POST' }); await loadUnits(); return openUnit(unit.id, true);
  }
  if ((el = c('[data-mv]'))) { const i = +el.dataset.mv, j = i + +el.dataset.d; [draft.images[i], draft.images[j]] = [draft.images[j], draft.images[i]]; return render(); }
  if ((el = c('[data-rm]'))) { draft.images.splice(+el.dataset.rm, 1); return render(); }
});
async function deleteUnit(id) {
  const u = units.find(x => x.id === id);
  const busy = u && (u.status === 'processing' || u.status === 'queued');
  if (!confirm(`Delete “${u?.title || 'this reading'}”${busy ? ' and stop its generation' : ''}? Its photos, text and progress are removed.`)) return;
  await api('/api/units/' + id, { method: 'DELETE' });
  delete state.progress[id];
  if (state.current === id) { unit = null; state.current = null; }
  saveState(); await loadUnits(); render();
}
function goSentence(i) {
  if (!unit || i < 0 || i >= unit.sentences.length) return;
  gIdx = i; gOpen.clear(); sel = null;
  prog().pos = i; saveState(); render();
}
function revealNext() {
  const secs = guidedSections(unit.sentences[gIdx]);
  const nxt = secs.find(x => !gOpen.has(x.k));
  if (nxt) { gOpen.add(nxt.k); render(); } else goSentence(gIdx + 1);
}
$('#fileIn').onchange = e => { addImages([...e.target.files]); e.target.value = ''; };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && playing) { stopAudio(); return; }
  if ($('#camDlg').open) { if (e.code === 'Space') { e.preventDefault(); $('#snap').click(); } return; }
  if (e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (view !== 'unit' || unit?.status !== 'ready') return;
  const k = e.key;
  if (k === 't') document.querySelector('[data-tog="showEn"]')?.click();
  else if (k === 's') document.querySelector('[data-tog="showReading"]')?.click();
  else if (k === 'g') $('#glossBtn')?.click();
  else if (k === 'c') document.querySelector('[data-tog="posColor"]')?.click();
  else if (k === 'h') document.querySelector('[data-tog="highlight"]')?.click();
  else if (k === '+' || k === '=') $('#fsUp')?.click();
  else if (k === '-') $('#fsDown')?.click();
  else if (state.tab === 'guided') {
    if (k === 'ArrowRight') goSentence(gIdx + 1);
    else if (k === 'ArrowLeft') goSentence(gIdx - 1);
    else if (k === ' ') { e.preventDefault(); revealNext(); }
    else if (k === 'r') speak(unit.sentences[gIdx].text, null, voiceFor(unit.sentences[gIdx].speaker));
    else if (k === 'Enter') { if (!has(prog().done, gIdx)) toggleIn('done', gIdx); goSentence(gIdx + 1); }
    else return;
    e.preventDefault();
  }
});

// Paste: images go to the tray; text goes into the composer when not typing somewhere.
document.addEventListener('paste', e => {
  const files = [...e.clipboardData.files].filter(f => f.type.startsWith('image/'));
  if (files.length) { e.preventDefault(); return addImages(files); }
  const text = e.clipboardData.getData('text');
  if (text && !e.target.matches('input, textarea')) { draft.text = (draft.text ? draft.text + '\n\n' : '') + text; view = 'compose'; render(); }
});
const app = $('#app');
app.addEventListener('dragover', e => { e.preventDefault(); app.classList.add('drop'); });
app.addEventListener('dragleave', e => { if (!app.contains(e.relatedTarget)) app.classList.remove('drop'); });
app.addEventListener('drop', e => {
  e.preventDefault(); app.classList.remove('drop');
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (files.length) return addImages(files);
  const text = e.dataTransfer.getData('text');
  if (text) { draft.text = (draft.text ? draft.text + '\n\n' : '') + text; view = 'compose'; render(); }
});
setInterval(() => { if (view === 'unit' && unit?.status === 'processing') renderPending(); }, 1000);

/* ================= boot ================= */
(async () => {
  state = { ...state, ...(await api('/api/state')) };
  state.progress ||= {};
  if (!state.model) state.model = (await api('/api/config')).model;
  applyFont();
  await loadUnits();
  if (state.current && units.some(u => u.id === state.current)) openUnit(state.current); else render();
})();
</script>
