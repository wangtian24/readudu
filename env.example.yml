# Readudu configuration.
# Copy to env.yml (git-ignored) and fill in what you need. Every key can also be set as an
# environment variable in UPPER_CASE (e.g. ELEVENLABS_API_KEY=...), which overrides env.yml.

# --- server ---
port: 4321
host: 127.0.0.1          # keep on localhost; the app has no authentication
data_dir: ./data         # photos, generated units, audio cache, progress

# --- unit generation (Claude Code CLI, headless `claude -p`) ---
claude_bin: claude       # path/name of the Claude Code CLI; must be logged in
model: opus              # default model alias for new units (opus | sonnet | full model id); the UI can override per unit
max_parallel_runs: 3     # how many units can generate at once
max_output_tokens: 64000 # passed as CLAUDE_CODE_MAX_OUTPUT_TOKENS; long readings need a lot

# --- text-to-speech ---
tts_provider: elevenlabs # elevenlabs | say (macOS built-in voices) | none
elevenlabs_api_key:      # https://elevenlabs.io → Developers → API keys (needs text_to_speech permission)
elevenlabs_model: eleven_multilingual_v2
elevenlabs_voice_female: EXAVITQu4vr4xnSDxMaL   # "Sarah"; any voice ID works with the multilingual model
elevenlabs_voice_male: JBFqnCBsd6RMkjVDRZzb     # "George"; dialog speakers alternate between the two
# The defaults are English-native voices, so other languages get an English accent. For native-sounding
# audio, pick voices per language in the ElevenLabs Voice Library and add them (language = ISO code):
# elevenlabs_voice_fr: <voice id>            # used for both speakers
# elevenlabs_voice_ar_female: <voice id>
# elevenlabs_voice_ar_male: <voice id>
